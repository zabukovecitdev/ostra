[project]
name = "ostra"
version = "0.1.0"
description = "Local retrieval pipeline that embeds personal text files on the CPU or with Ollama and searches them by vector similarity."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rok Zabukovec" }]
keywords = ["rag", "embeddings", "vector-search", "sqlite-vec", "ollama", "fastembed", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "fastembed>=0.9.1",
    "ollama>=0.6.3",
    "platformdirs>=4.14.0",
    "pydantic-settings>=2.16.2",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.3",
    "tqdm>=4.70.1",
]

[project.scripts]
ostra = "ostra.cli.main:main"
ostra-daemon = "ostra.cli.daemon:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "complexipy>=8.3.0",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-tqdm>=4.70.0.20261106",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.complexipy]
paths = ["src", "evals"]
max-complexity-allowed = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mutmut]
source_paths = ["src/ostra/"]

[tool.mypy]
python_version = "3.14"
files = ["src", "evals"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true
