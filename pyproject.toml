[project]
name = "ostra"
version = "0.1.0"
description = "Local retrieval pipeline that embeds personal text files with Ollama and searches them by vector similarity."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rok Zabukovec" }]
keywords = ["rag", "embeddings", "vector-search", "sqlite-vec", "chroma", "ollama", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "chromadb>=1.5.9",
    "ollama>=0.6.3",
    "platformdirs>=4.14.0",
    "pydantic-settings>=2.16.2",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.3",
]

[project.scripts]
ostra = "ostra.main:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mutmut>=3.8.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/ostra/"]
